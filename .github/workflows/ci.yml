name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lint, types, tests front & serveur, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache des paquets bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Dépendances front
        run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Environnement Python
        run: uv sync

      - name: Outils système (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint (oxlint + ruff)
        run: bun run lint

      - name: Types (tsc)
        run: bun run typecheck

      - name: Tests front
        run: bun test tests/

      - name: Tests serveur
        run: uv run pytest tests/ -q

      - name: Build de production
        run: bun run build

  browser:
    name: parcours navigateur (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache des paquets bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Dépendances front
        run: bun install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Préparer l'environnement Python
        run: uv sync

      - name: Navigateur Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build servi par l'API
        run: bun run build

      - name: Vérification navigateur
        run: bun tests/e2e/browser_check.mjs
