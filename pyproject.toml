[project]
name = "night-light-server"
version = "2.0.0"
description = "Analyse audio serveur (librosa) pour un light show musical personnel."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Découverte de la structure répétitive (couplet, refrain…). Voir
    # `server/structure.py` : un shim de compatibilité est nécessaire car msaf
    # 0.1.80 fait `from scipy import inf`, retiré depuis scipy 1.12.
    "msaf>=0.1.80",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 : FastAPI et pydantic appellent légitimement `File(...)` et les valeurs
# par défaut de `MatchThresholds` dans la signature.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# msaf (dernière version, 2023) s'appuie sur des API scipy/jsonschema dépréciées :
# ces avertissements ne concernent pas notre code.
filterwarnings = [
    "ignore::DeprecationWarning:msaf.*",
    "ignore::DeprecationWarning:jsonschema.*",
]

[tool.uv]
package = false
