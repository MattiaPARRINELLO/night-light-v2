[project]
name = "night-light-server"
version = "2.0.0"
description = "Analyse audio serveur (librosa) pour un light show musical personnel."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 : FastAPI et pydantic appellent légitimement `File(...)` et les valeurs
# par défaut de `MatchThresholds` dans la signature.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
